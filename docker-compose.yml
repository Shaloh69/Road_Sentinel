# Local development MySQL for RoadSentinel — NOT the irm-pc production setup.
#
# Runs on host port 3307 (not 3306) deliberately, so it never collides with
# any other local MySQL install already using 3306 on this machine.
#
# Data lives in ./.data/mysql (a bind mount, gitignored) rather than a Docker
# named volume, so the database files sit on the same drive as this repo —
# D: here, which has the free space — instead of inside Docker Desktop's VHDX
# on C:. Detections and recordings accumulate over time, so this matters.
# `docker compose down` keeps the data; deleting ./.data/mysql wipes it.
#
# Credentials below are local-dev-only defaults, not secrets — this database
# is never exposed outside localhost. Production uses its own generated
# password per server/node-service/.env.example's guidance and is likewise
# bound to localhost only, never through Tailscale or the Cloudflare tunnel.
services:
  mysql:
    image: mysql:8.0
    container_name: roadsentinel-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: roadsentinel_root_dev
      MYSQL_DATABASE: roadsentinel
      MYSQL_USER: roadsentinel
      MYSQL_PASSWORD: roadsentinel_dev
    volumes:
      - ./.data/mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "roadsentinel",
          "-proadsentinel_dev",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer
    container_name: roadsentinel-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy
