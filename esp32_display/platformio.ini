; Road Sentinel — ESP32 HUB75 display driver
;
; Build/upload:
;   pio run                      compile
;   pio run -t upload            flash the board
;   pio device monitor           serial monitor (115200)
;   pio run -t upload -t monitor flash then watch
;
; The board talks to the Pi over this same USB serial link, so close the
; monitor before starting esp32_display_bridge.py — two processes cannot hold
; the same port, and the symptom (silent board, no error) is confusing.

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed  = 115200
upload_speed   = 921600

; Pinned rather than floating: a library bump that changes the pin-config
; struct would break the build at a point where the failure looks like a
; wiring problem, which is an expensive thing to debug twice.
;
; Note the owner is `mrfaptastic`, not `mrcodetastic`. The GitHub org was
; renamed but the PlatformIO registry entry kept the original owner name, so
; the GitHub URL and the registry ID disagree. Using the GitHub name fails
; with UnknownPackageError.
;
; Adafruit GFX is a hard dependency of the HUB75 library but is NOT declared
; by it, so PlatformIO will not pull it in automatically — the build fails
; with "fatal error: Adafruit_GFX.h: No such file or directory". BusIO is in
; turn required by GFX. Both must be listed explicitly.
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ ^3.0.15
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.16.1

build_flags =
    -DCORE_DEBUG_LEVEL=0

; Uncomment for an ESP32-S3 board instead of the classic ESP32.
; [env:esp32-s3-devkitc-1]
; platform  = espressif32
; board     = esp32-s3-devkitc-1
; framework = arduino
; monitor_speed = 115200
; lib_deps = mrcodetastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ ^3.0.11
