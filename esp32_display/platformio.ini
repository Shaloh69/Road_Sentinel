; Road Sentinel — ESP32 HUB75 display driver
;
; Build/upload:
;   pio run                      compile
;   pio run -t upload            flash the board
;   pio device monitor           serial monitor (115200)
;   pio run -t upload -t monitor flash then watch
;
; The board talks to the Pi over this same USB serial link, so close the
; monitor before starting esp32_display_bridge.py — two processes cannot hold
; the same port, and the symptom (silent board, no error) is confusing.

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed  = 115200
upload_speed   = 921600

; Pinned rather than floating: a library bump that changes the pin-config
; struct would break the build at a point where the failure looks like a
; wiring problem, which is an expensive thing to debug twice.
lib_deps =
    mrcodetastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ ^3.0.11

build_flags =
    -DCORE_DEBUG_LEVEL=0

; Uncomment for an ESP32-S3 board instead of the classic ESP32.
; [env:esp32-s3-devkitc-1]
; platform  = espressif32
; board     = esp32-s3-devkitc-1
; framework = arduino
; monitor_speed = 115200
; lib_deps = mrcodetastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ ^3.0.11
