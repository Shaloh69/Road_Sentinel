; Road Sentinel — ESP32 HUB75 sign driver (Pi 4 installation)
;
; Build/upload (run these ON THE PI — the board is cabled there anyway, so
; there is no swapping cables between a laptop and the installation site):
;   pio run                      compile
;   pio run -t upload            flash
;   pio device monitor           serial monitor (115200)
;
; The board talks to the Pi over this same USB serial link, so close the
; monitor before starting esp32_display_bridge.py — two processes cannot hold
; the same port, and the symptom (silent board, no error) is confusing.

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed  = 115200

; 921600 fails REPRODUCIBLY on this rig while the panel is drawing a
; full-brightness frame: the current draw browns the board out at the end of
; the write ("Failed to leave compressed flash mode ... C800: Not enough
; data"). 230400 is reliable. This cost two failed flashes before it was
; noticed, so it is pinned low deliberately — do not "optimise" it back up.
upload_speed   = 230400

; The portable core, shared with the STM32 build. Same convention as the
; lanzones-robotics-os projects.
lib_extra_dirs = ${PROJECT_DIR}/../shared

; NOTE: ESP32-HUB75-MatrixPanel-DMA is deliberately NOT here. It cannot drive
; these 1/8-scan FM6124 panels: it assumes its DMA column index equals the
; shift-register clock position, which is false on this hardware and not
; correctable through its API. See shared/HUB75Sign/hub75.h and DEBUG_LOG.md.
;
; Adafruit GFX stays — it is pure software drawing (fonts, shapes, text) and
; was never implicated. BusIO is a hard dependency of GFX and must be listed
; explicitly, or the build fails with a missing-header error.
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.16.1

build_flags =
    -DCORE_DEBUG_LEVEL=0
