; Road Sentinel — STM32 HUB75 sign driver (Pi 5 installation)
;
; WeAct Black Pill V3.0, STM32F411CEU6. Settings follow the field notes from
; the lanzones-robotics-os builds on this same board — every one of them was
; learned the hard way and is repeated here rather than rediscovered.
;
; ── Flashing ───────────────────────────────────────────────────────────────
;   1. WARM THE CHIP FIRST. This board's DFU bootloader USB clock is
;      temperature-marginal (documented WeAct/QMK issue, 25MHz crystal). Cold,
;      transfers over ~2KB drop mid-way and reads return phantom data — which
;      looks exactly like a dead board and is not.
;   2. Enter DFU: hold BOOT0, tap NRST, release BOOT0 (USB plugged in).
;   3. Flash in ONE session: pio run -t upload
;      Never split the write across multiple CubeProgrammer connections —
;      chunked writes ACK and then silently lose most blocks.
;
; upload_protocol = cubeprogrammer DOES NOT EXIST in PlatformIO (that is an
; Arduino-IDE feature of STM32duino). PlatformIO warns and then never uploads.
; Going through `custom` is the same intent in a form that actually works.
; port=usb1 is USB DFU; swap to port=SWD if an ST-Link is ever available.

[env:blackpill_f411ce]
platform  = ststm32
board     = blackpill_f411ce
framework = arduino

monitor_speed = 115200

upload_protocol = custom
upload_command = "C:\Program Files\STMicroelectronics\STM32Cube\STM32CubeProgrammer\bin\STM32_Programmer_CLI.exe" -c port=usb1 -w "$BUILD_DIR\firmware.bin" 0x08000000 -v -g

; The portable core, shared with the ESP32 build.
lib_extra_dirs = ${PROJECT_DIR}/../shared

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.16.1

; USB-CDC puts the global Serial object on the native USB port — the same
; USB-C cable used for DFU flashing — instead of USART1. That is what lets the
; Pi drive this sign over one cable with no USB-serial adapter, matching how
; the ESP32 sign is wired. DFU (bootloader-mode) and CDC (app-mode) never
; enumerate at the same time, so there is no conflict with the upload flow.
;
; The stock blackpill_f411ce manifest has no "hwids" entry, so CDC falls back
; to VID/PID 0x0000/0x0000 and no COM port appears. boards/blackpill_f411ce.json
; is a project-local copy with ST's own Virtual COM Port ID added; PlatformIO's
; boards/ directory shadows the platform board of the same id automatically.
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USB_MANUFACTURER_STRING='"Road Sentinel"'
    -D USB_PRODUCT_STRING='"Road Sentinel LED Sign"'
